name: Icons

# Keeps the icons in step with Simple Icons, which releases weekly (usually
# on Sunday) and a major about every six months. Every day this checks npm
# for a newer simple-icons release and, when there is one, regenerates the
# icons (scripts/dev/update-icons.sh: sha512-checked download, byte-for-byte
# SVG check), adds a changelog fragment, and opens a pull request on the
# branch chore/simple-icons-update, or updates the one that is open. A
# person reviews and merges it; docs/updating-icons.md explains.
#
# A pull request opened with the default GITHUB_TOKEN starts no workflow,
# so CI would not run on it. With the ICONS_TOKEN secret (a fine-grained
# token or GitHub App token with contents and pull-requests write on this
# repository) it does; without it, close and reopen the pull request to
# start CI (docs/updating-icons.md).

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "A simple-icons version (X.Y.Z); empty for the latest"
        required: false
        default: ""

permissions: {}

concurrency:
  group: icons
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  BRANCH: chore/simple-icons-update

jobs:
  update:
    name: update to the latest Simple Icons
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: is there a newer release?
        id: check
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          pinned="$(jq -r .simpleIconsVersion simple-icons.json)"
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif version="$(bash scripts/dev/update-icons.sh --check)"; then
            echo "simple-icons $pinned is the latest; nothing to do."
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$version' is not X.Y.Z"; exit 1; }
          if [ "$version" = "$pinned" ]; then
            echo "simple-icons $version is already pinned; nothing to do."
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          major_from="${pinned%%.*}"
          major_to="${version%%.*}"
          {
            echo "update=true"
            echo "version=$version"
            echo "pinned=$pinned"
            echo "major=$([ "$major_from" != "$major_to" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: regenerate the icons
        if: steps.check.outputs.update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          # shellcheck disable=SC2016 # the backticks are Markdown and Swift, not expansions
          list() { sed -n 's/^        \.`\{0,1\}\([a-z0-9_]*\)`\{0,1\},$/\1/p' Sources/SimpleIcons/Generated/SimpleIcon+AllCases.swift | sort; }
          list > "$RUNNER_TEMP/before"
          bash scripts/dev/update-icons.sh "$VERSION"
          list > "$RUNNER_TEMP/after"
          comm -13 "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" > "$RUNNER_TEMP/added"
          comm -23 "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" > "$RUNNER_TEMP/removed"
          wc -l < "$RUNNER_TEMP/added" | tr -d ' ' > "$RUNNER_TEMP/added-count"
          wc -l < "$RUNNER_TEMP/removed" | tr -d ' ' > "$RUNNER_TEMP/removed-count"

      # The build and tests run here too, so a release the package cannot
      # take (a slug that is no Swift name, an SVG it cannot rebuild, a path
      # that does not parse) fails this job instead of opening a broken
      # pull request.
      - name: build and test
        if: steps.check.outputs.update == 'true'
        run: swift test -Xswiftc -warnings-as-errors

      - name: changelog fragment
        if: steps.check.outputs.update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          added="$(cat "$RUNNER_TEMP/added-count")"
          removed="$(cat "$RUNNER_TEMP/removed-count")"
          slug="${VERSION//./-}"
          # Issue 0: no issue of its own, so the cut adds no reference.
          printf -- '- The icons are those of [Simple Icons %s](https://github.com/simple-icons/simple-icons/releases/tag/%s): %s new, %s removed, and updated paths and metadata.\n' \
            "$VERSION" "$VERSION" "$added" "$removed" > "changelog.d/0-simple-icons-$slug.changed.md"
          if [ "$removed" -gt 0 ]; then
            {
              printf -- '- Removed the icons Simple Icons %s removed; code that uses one no longer compiles:\n' "$VERSION"
              # One continuation line, indented two spaces: `a`, `b`, `c`
              # shellcheck disable=SC2016 # the backticks are Markdown, not expansions
              paste -sd, - < "$RUNNER_TEMP/removed" | sed 's/,/`, `/g; s/^/  `/; s/$/`/'
            } > "changelog.d/0-simple-icons-$slug.removed.md"
          fi
          bash scripts/release/changelog.sh --check

      - name: open or update the pull request
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.ICONS_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.check.outputs.version }}
          PINNED: ${{ steps.check.outputs.pinned }}
          MAJOR: ${{ steps.check.outputs.major }}
          ICONS_TOKEN_SET: ${{ secrets.ICONS_TOKEN != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A Sources simple-icons.json changelog.d
          git commit -q -m "chore: update the icons to Simple Icons $VERSION"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$BRANCH"

          added="$(cat "$RUNNER_TEMP/added-count")"
          removed="$(cat "$RUNNER_TEMP/removed-count")"
          {
            echo "Updates the icons from Simple Icons $PINNED to [$VERSION](https://github.com/simple-icons/simple-icons/releases/tag/$VERSION), made by \`scripts/dev/update-icons.sh\` (npm tarball checked against its sha512, every SVG rebuilt byte for byte) and checked by \`swift test\` before this pull request was opened."
            echo
            echo "- New icons: $added"
            # shellcheck disable=SC2016 # the backticks are Markdown, not expansions
            [ "$added" -gt 0 ] && sed 's/^/  - `/; s/$/`/' "$RUNNER_TEMP/added"
            echo "- Removed icons: $removed"
            # shellcheck disable=SC2016 # the backticks are Markdown, not expansions
            [ "$removed" -gt 0 ] && sed 's/^/  - `/; s/$/`/' "$RUNNER_TEMP/removed"
            echo
            if [ "$MAJOR" = "true" ] || [ "$removed" -gt 0 ]; then
              echo "> [!WARNING]"
              echo "> Icons were removed: their constants are gone, so the next release is a **major** one (docs/releasing.md)."
              echo
            fi
            if [ "$ICONS_TOKEN_SET" != "true" ]; then
              echo "If CI did not start, close and reopen this pull request (docs/updating-icons.md)."
            fi
          } > "$RUNNER_TEMP/body.md"

          labels=(--label icons)
          if [ "$MAJOR" = "true" ] || [ "$removed" -gt 0 ]; then labels+=(--label breaking); fi
          title="chore: update the icons to Simple Icons $VERSION"
          number="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/body.md" "${labels[@]/--label/--add-label}"
            echo "updated #$number" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md" "${labels[@]}"
            echo "opened a pull request for Simple Icons $VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi
