name: Release

# A tag vX.Y.Z on main publishes the GitHub release "simple-icons-swift
# X.Y.Z" with its CHANGELOG.md section as notes. Pushing the tag is the one
# human decision; the notes were already reviewed in the release pull
# request. A Swift package ships as source: SwiftPM and Swift Package Index
# resolve the version from the tag, so there is nothing to build or upload.
# Before anything is published, the tag is checked against the changelog
# and the pinned icons (scripts/release/check-version.sh) and the tests run
# on the tagged commit; a failure stops the lane and publishes nothing. The
# repository has immutable releases on: once published, the release, its
# notes and its tag never change. docs/releasing.md has the procedure.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  plan:
    name: tag is on main and matches the changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the tag is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TAG" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - name: check-version.sh
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release/check-version.sh "$TAG"

  test:
    name: tests on the tagged commit
    needs: plan
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: swift test
        run: swift test --force-resolved-versions -Xswiftc -warnings-as-errors

  publish:
    name: publish the release
    needs: [plan, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release/notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --repo "$REPO" --verify-tag --latest \
            --title "simple-icons-swift ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          echo "Released $TAG: $(gh release view "$TAG" --repo "$REPO" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
